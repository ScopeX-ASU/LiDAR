[build-system]
requires = ["setuptools>=74"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-picroute"
dynamic = ["version"]
description = "Curvy-aware detailed routing for large-scale photonic integrated circuits"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {file = "LICENSE"}
authors = [
  {name = "Hongjian Zhou"},
  {name = "Keren Zhu"},
  {name = "Jiaqi Gu"},
]
dependencies = [
  "gdsfactory>=9.45,<10",
  "kfactory>=3.0.0rc4,<3.1",
  "networkx>=3.4,<4",
  "numpy>=2,<3",
  "pydantic>=2.13.4,<2.14",
  "PyYAML>=6,<7",
  "shapely>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "ruff>=0.15,<0.16"]

[project.scripts]
picroute = "picroute.main.picroute:main"
picroute-batch = "picroute.scripts.lidar.run_route:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["picroute*"]

[tool.setuptools.package-data]
picroute = ["config/*.yml", "benchmarks/*/*.yml"]

[tool.setuptools.dynamic]
version = {attr = "picroute.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["src/unitest"]
addopts = "--tb=short"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
